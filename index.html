<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveKit Test</title>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #00b894;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
      color: #00ff99;
    }

    audio {
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>LiveKit Voice Test</h1>

  <button onclick="joinRoom()">Join Room</button>

  <div id="status">Disconnected</div>

  <script>
    const LIVEKIT_URL = "wss://golla-9cleum8t.livekit.cloud";

    const TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzgyOTg4NTIsImlkZW50aXR5IjoiR29sbGFDaGF0IiwiaXNzIjoiQVBJUVBmWFZnVFo0VzlzIiwibmJmIjoxNzc4Mjk3OTUyLCJzdWIiOiJHb2xsYUNoYXQiLCJ2aWRlbyI6eyJjYW5QdWJsaXNoIjp0cnVlLCJjYW5QdWJsaXNoRGF0YSI6dHJ1ZSwiY2FuU3Vic2NyaWJlIjp0cnVlLCJyb29tIjoibWFpbi1yb29tIiwicm9vbUpvaW4iOnRydWV9fQ.H0RNxumWUECx_1KekGi-y9GSvW9Ly41jqaiIzIXm21A";

    async function joinRoom() {
      try {
        document.getElementById("status").innerText = "Connecting...";

        const room = new LivekitClient.Room();

        await room.connect(LIVEKIT_URL, TOKEN);

        document.getElementById("status").innerText = "✅ Connected to LiveKit";

        // Enable microphone
        await room.localParticipant.enableCameraAndMicrophone(false, true);

        console.log("Connected Room:", room.name);

        // Listen for remote users
        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
          console.log("Track subscribed from:", participant.identity);

          if (track.kind === 'audio') {
            const audioElement = track.attach();
            document.body.appendChild(audioElement);
          }
        });

        room.on(LivekitClient.RoomEvent.ParticipantConnected, (participant) => {
          console.log("User Joined:", participant.identity);
        });

        room.on(LivekitClient.RoomEvent.ParticipantDisconnected, (participant) => {
          console.log("User Left:", participant.identity);
        });

      } catch (error) {
        console.error(error);
        document.getElementById("status").innerText = "❌ Connection Failed";
      }
    }
  </script>

</body>
</html>
