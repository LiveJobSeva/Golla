<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golla Voice App</title>
    <style>
        body { background: #0b141a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #162127; padding: 30px; border-radius: 20px; border: 1px solid #00a884; width: 85%; max-width: 350px; text-align: center; }
        #status { margin: 20px 0; font-weight: bold; color: #ffcc00; }
        .btn { background: #00a884; border: none; padding: 15px; color: white; border-radius: 10px; font-size: 18px; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎙️ Golla Voice</h2>
        <div id="status">Ready</div>
        <button class="btn" onclick="connect()">Start Connection</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <script>
        async function connect() {
            const status = document.getElementById('status');
            const url = "wss://golla-9cleum8t.livekit.cloud";
            // Naya token yahan paste karein agar 15 min ho gaye hain toh
            const token = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3NzgyOTg4NTIsImlkZW50aXR5IjoiR29sbGFDaGF0IiwiaXNzIjoiQVBJUVBmWFZnVFo0VzlzIiwibmJmIjoxNzc4Mjk3OTUyLCJzdWIiOiJHb2xsYUNoYXQiLCJ2aWRlbyI6eyJjYW5QdWJsaXNoIjp0cnVlLCJjYW5QdWJsaXNoRGF0YSI6dHJ1ZSwiY2FuU3Vic2NyaWJlIjp0cnVlLCJyb29tIjoibWFpbi1yb29tIiwicm9vbUpvaW4iOnRydWV9fQ.H0RNxumWUECx_1KekGi-y9GSvW9Ly41jqaiIzIXm21A";

            try {
                status.innerText = "Connecting...";
                const room = new LiveKit.Room();
                await room.connect(url, token);
                status.innerText = "✅ ONLINE";
                status.style.color = "#00ff88";

                alert("Connect ho gaya!");

                status.innerText = "❌ Error";
                alert("Error: " + e.message);
